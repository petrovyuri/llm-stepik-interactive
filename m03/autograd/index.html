<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autograd</title>
<link rel="stylesheet" href="../../kit/kit.css">
<style>
.ag { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; }
#graph { flex: 1 1 230px; max-width: 250px; height: auto; aspect-ratio: 8 / 5; }
.side { flex: 1 1 300px; min-width: 0; display: grid; gap: 8px; }
.code, .console { margin: 0; padding: 8px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
.console b { color: var(--green); font-weight: 500; }
.hint { margin: 0; font-size: 13.5px; }
</style>
</head>
<body>
<p class="eyebrow">Модуль 3 · урок «PyTorch самое нужное»</p>
<h1>Как PyTorch сам считает производную</h1>
<noscript><div class="panel">Демо не запустилось. Откройте его в отдельной вкладке.</div></noscript>

<div class="panel">
  <div class="row row--spread">
    <div class="row" id="presets"></div>
    <button type="button" class="btn-play" id="play">▶ по шагам</button>
  </div>
  <div class="row row--top">
    <div class="slider-holder" id="w-slider"></div>
    <div class="slider-holder" id="x-slider"></div>
    <button type="button" id="backward">y.backward()</button>
  </div>
</div>

<div class="panel ag">
  <svg id="graph" viewBox="0 0 320 200" aria-label="Граф вычислений: w и x входят в умножение, результат - y"></svg>
  <div class="side">
    <pre class="code mono" id="code"></pre>
    <pre class="console mono" id="console" aria-live="polite"></pre>
    <p class="muted hint" id="nudge"></p>
  </div>
</div>
<p class="caption" id="caption"></p>

<script type="module">
import { lit, nudge, outputs, steps } from "./logic.js";
import { num } from "../../kit/format.js";
import { svg, presets, slider, stepPlayer, ready } from "../../kit/ui.js";

const PRESETS = [
  { label: "пример урока", value: { w: 2, x: 3 } },
  { label: "x = 0", value: { w: 2, x: 0 } },
  { label: "отрицательный x", value: { w: 2, x: -1.5 } },
];
const state = { w: 2, x: 3, done: false };
const $ = (id) => document.getElementById(id);
const graph = $("graph");

function text(content, attrs) {
  const node = svg("text", { fill: "var(--ink)", "font-size": 13, "text-anchor": "middle", ...attrs });
  node.textContent = content;
  return node;
}

/** stage: -1 обычный вид; 0 прямой проход; 1 обратный; 2 вывод. */
function drawGraph(stage) {
  graph.replaceChildren();
  const defs = svg("defs");
  const head = svg("marker", { id: "head", viewBox: "0 0 10 10", refX: 8, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" });
  head.append(svg("path", { d: "M0,0 L10,5 L0,10 z", fill: "var(--orange)" }));
  defs.append(head);
  graph.append(defs);
  const forward = stage === 0;
  const back = state.done || stage >= 1;
  const edge = (x1, y1, x2, y2) => svg("line", { x1, y1, x2, y2, stroke: forward ? "var(--orange)" : "var(--line)", "stroke-width": 2.5 });
  graph.append(edge(70, 50, 150, 100), edge(70, 150, 150, 100), edge(178, 100, 250, 100));
  const node = (cx, cy, color, label, sub) => {
    graph.append(svg("circle", { cx, cy, r: 26, fill: "var(--panel-2)", stroke: color, "stroke-width": 2.5 }));
    graph.append(text(label, { x: cx, y: cy + 5, fill: color, "font-weight": 700 }));
    if (sub) graph.append(text(sub, { x: cx, y: cy + 44, fill: "var(--muted)", "font-size": 12 }));
  };
  node(44, 50, "var(--cyan)", "w", `w = ${lit(state.w)}`);
  node(44, 150, "var(--purple)", "x", `x = ${lit(state.x)}`);
  graph.append(svg("circle", { cx: 164, cy: 100, r: 14, fill: "var(--panel-2)", stroke: "var(--orange)", "stroke-width": 2 }));
  graph.append(text("×", { x: 164, y: 105, fill: "var(--orange)", "font-size": 16 }));
  node(276, 100, "var(--green)", "y", `y = ${lit(state.w * state.x)}`);
  graph.append(text("requires_grad", { x: 44, y: 14, fill: "var(--cyan)", "font-size": 11 }));
  if (back) {
    graph.append(svg("path", { d: "M 250 84 C 210 20, 120 10, 70 38", fill: "none", stroke: "var(--orange)", "stroke-width": 2, "stroke-dasharray": "6 5", "marker-end": "url(#head)" }));
    graph.append(text(`dy/dw = ${lit(state.x)}`, { x: 165, y: 24, fill: "var(--orange)", "font-size": 12.5 }));
  }
}

function render(stage = -1) {
  const out = outputs(state.w, state.x);
  drawGraph(stage);
  $("code").textContent = [
    `w = torch.tensor(${lit(state.w)}, requires_grad=True)`,
    `x = torch.tensor(${lit(state.x)})`,
    "",
    "y = w * x",
    "y.backward()",
    "",
    "print(w.grad)",
  ].join("\n");
  const shown = state.done || stage >= 1;
  $("console").replaceChildren(
    "y      → ", out.y, "\n",
    "w.grad → ", Object.assign(document.createElement("b"), { textContent: shown ? out.gradAfter : out.gradBefore }),
  );
  $("backward").disabled = state.done;
  $("nudge").textContent = nudge(state.x);
}

function rerun() {
  player.stop();
  state.done = false;
  presetBar.setActive(null);
  render();
}

const wSlider = slider($("w-slider"), { label: "w", min: -5, max: 5, step: 0.5, value: state.w, format: (v) => num(v), onInput: (v) => { state.w = v; rerun(); } });
const xSlider = slider($("x-slider"), { label: "x", min: -5, max: 5, step: 0.5, value: state.x, format: (v) => num(v), onInput: (v) => { state.x = v; rerun(); } });

$("backward").addEventListener("click", () => {
  player.stop();
  state.done = true;
  $("caption").textContent = steps(state.w, state.x)[1];
  render();
});

const player = stepPlayer($("play"), {
  steps: () => steps(state.w, state.x),
  onStep(i, caption) {
    $("caption").textContent = caption ?? "";
    if (i === 0) state.done = false;   // прямой проход идёт до backward: градиента ещё нет
    if (i >= 1) state.done = true;
    render(i);
  },
});

const presetBar = presets($("presets"), PRESETS, (value) => {
  player.stop();
  state.w = value.w;
  state.x = value.x;
  state.done = false;
  wSlider.set(value.w);
  xSlider.set(value.x);
  $("caption").textContent = "";
  render();
});
presetBar.setActive(0);

render();
ready();
</script>
</body>
</html>
