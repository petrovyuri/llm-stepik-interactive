<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карта слов GPT-2</title>
<link rel="stylesheet" href="../../kit/kit.css">
<style>
.layout { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 12px; }
.map { display: block; width: 100%; height: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
.pt { cursor: pointer; transition: transform .6s ease; }
.pt circle { stroke: var(--bg); stroke-width: 1; }
.pt text { font-size: 11px; fill: var(--ink); }
.pt line { stroke: var(--muted); stroke-width: .7; }
.pt.is-pick circle, .pt:focus-visible circle { stroke: var(--yellow); stroke-width: 2.5; }
.pt:focus-visible { outline: none; }
.legend { display: flex; flex-wrap: wrap; gap: 2px 10px; margin: 6px 0 0; padding: 0; list-style: none; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 9px; height: 9px; margin-right: 4px; border-radius: 50%; }
.info h2 { margin: 0; font-size: 15px; }
.nb { width: 100%; border-collapse: collapse; font-size: 13px; }
.nb td { padding: 2px 4px; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
.nb td:nth-child(n+2) { text-align: right; color: var(--muted); white-space: nowrap; }
.note { margin: 6px 0 0; font-size: 12.5px; }
@media (max-width: 520px) { .layout { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<p class="eyebrow">Модуль 7 · урок «Векторные представления»</p>
<h1>Карта слов: настоящие эмбеддинги GPT-2</h1>
<noscript><div class="panel">Демо не запустилось. Откройте его в отдельной вкладке.</div></noscript>

<div class="panel"><div class="row" id="modes"></div></div>
<div class="panel layout">
  <div>
    <svg class="map" id="map" viewBox="0 0 400 300" role="group" aria-label="Карта 25 слов"></svg>
    <ul class="legend" id="legend"></ul>
  </div>
  <div class="info">
    <h2 class="mono" id="word"></h2>
    <p class="muted note">Ближайшие по смыслу во всём словаре gpt2:</p>
    <table class="nb mono" id="neighbors"></table>
    <p class="note" id="nearest"></p>
  </div>
</div>
<p class="caption" id="caption" aria-live="polite"></p>
<p class="muted note">Близость - косинус угла между векторами: 1 - одно направление, около 0 - не связаны. Карта - тень 768 измерений на плоскости, соседей считаем во всех 768.</p>

<script type="module">
import { GROUPS, LABEL_HEIGHT, nearestById, neighborRows, placeLabels, screen, words } from "./logic.js";
import { el, presets, ready, svg } from "../../kit/ui.js";

const WORDS = words();
const COLORS = ["var(--cyan)", "var(--orange)", "var(--green)", "var(--purple)", "var(--yellow)"];
const $ = (id) => document.getElementById(id);
const state = { mode: "trained", pick: 0 };
const CAPTION = {
  trained: "Это GPT-2: словарь тот же, что у нашего токенизатора, только таблица уже обучена. Слова одной группы легли рядом. Наша модель пока выглядит как «до обучения».",
  random: "До обучения: те же слова на случайных векторах (std 0.02), с таких начинает наш слой. Группы рассыпались, соседи случайные, близость около 0.15.",
};

const points = WORDS.map((w, i) => {
  const g = svg("g", { class: "pt", tabindex: 0, role: "button", "aria-label": w.word });
  const text = svg("text", { x: 7, y: 4 });
  text.textContent = w.word;
  g.append(svg("line", { x1: 0, y1: 0, x2: 0, y2: 0 }), svg("circle", { r: 5, fill: COLORS[w.group] }), text);
  g.addEventListener("click", () => pick(i));
  g.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(i); }
  });
  $("map").append(g);
  return g;
});
/** Ширина подписей - настоящая, из браузера (запас - если страница ещё не отрисована). */
const widths = points.map((g, i) => g.querySelector("text").getComputedTextLength() || WORDS[i].word.length * 6.5 + 2);
$("legend").replaceChildren(...GROUPS.map((name, g) => el("li", {}, el("i", { style: `background:${COLORS[g]}` }), name)));

function render() {
  const xy = WORDS.map((_, i) => screen(state.mode, i));
  const labels = placeLabels(xy, widths);
  points.forEach((g, i) => {
    const [x, y] = xy[i];
    const { x: lx, y: ly, leader } = labels[i];
    g.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px)`;
    g.classList.toggle("is-pick", i === state.pick);
    const text = g.querySelector("text");
    text.setAttribute("x", lx.toFixed(1));
    text.setAttribute("y", ly.toFixed(1));
    // выноска - от точки к ближайшему краю отодвинутой подписи
    const top = ly - LABEL_HEIGHT * 0.8;
    const line = g.querySelector("line");
    line.setAttribute("x2", leader ? Math.min(Math.max(0, lx), lx + widths[i]).toFixed(1) : 0);
    line.setAttribute("y2", leader ? Math.min(Math.max(0, top), top + LABEL_HEIGHT).toFixed(1) : 0);
  });
  const w = WORDS[state.pick];
  $("word").textContent = `␣${w.word} · ID ${w.id}`;
  $("neighbors").replaceChildren(...neighborRows(state.mode, state.pick).map((n) =>
    el("tr", {}, el("td", {}, n.text), el("td", {}, String(n.id)), el("td", {}, n.sim))));
  const near = nearestById(state.mode, state.pick);
  $("nearest").textContent = `Ближе всех по номеру из 25 слов: ${near.text} (ID ${near.id}), близость ${near.sim}.`
    + (near.sameGroup ? " Здесь номер совпал со смыслом: частые слова получили маленькие номера. Сам номер о смысле не говорит." : "");
  $("caption").textContent = CAPTION[state.mode];
}

function pick(i) {
  state.pick = i;
  render();
}

const bar = presets($("modes"), [{ label: "обученная GPT-2", value: "trained" }, { label: "до обучения", value: "random" }],
  (mode) => { state.mode = mode; render(); });
bar.setActive(0);
render();
ready();
</script>
</body>
</html>
