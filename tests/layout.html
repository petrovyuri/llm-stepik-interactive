<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Проверка вёрстки демо</title>
<style>
body { margin: 0; padding: 16px; background: #fff; color: #222; font: 14px/1.4 system-ui, sans-serif; }
table { border-collapse: collapse; margin-bottom: 16px; }
td, th { border: 1px solid #ccc; padding: 4px 8px; text-align: left; }
#frames { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
iframe { border: 1px solid #999; display: block; flex: none; }   /* не ужимать: ширина 700/360 при любом окне */
</style>
</head>
<body>
<h1>Проверка вёрстки демо</h1>
<p>Каждое демо из demos.json грузится в iframe шириной 700 и 360 px с высотой из реестра.
На 700 px содержимое обязано влезть в высоту; горизонтальной прокрутки нет ни на одной ширине.</p>
<table>
  <thead><tr><th>демо</th><th>ширина</th><th>скрипт</th><th>высота</th><th>гориз. прокрутка</th></tr></thead>
  <tbody id="report"></tbody>
</table>
<div id="frames"></div>
<script type="module">
const WIDTHS = [700, 360];
const demos = await (await fetch("../demos.json")).json();
const report = document.getElementById("report");
const frames = document.getElementById("frames");
const results = [];

function load(src, width, height) {
  return new Promise((resolve) => {
    const frame = document.createElement("iframe");
    frame.src = src;
    frame.width = width;
    frame.height = height;
    frame.addEventListener("load", () => setTimeout(() => resolve(frame), 600));
    frames.append(frame);
  });
}

for (const demo of demos) {
  for (const width of WIDTHS) {
    const frame = await load(`../${demo.slug}/`, width, demo.height);
    const root = frame.contentDocument.documentElement;
    const ready = root.dataset.ready === "1";
    const height = root.scrollHeight;
    const overflowX = root.scrollWidth > root.clientWidth;
    const fits = width !== 700 || height <= demo.height;
    const ok = ready && fits && !overflowX;
    results.push({ slug: demo.slug, width, ready, height, limit: demo.height, overflowX, ok });
    const row = document.createElement("tr");
    row.innerHTML = `<td>${ok ? "✅" : "❌"} ${demo.slug}</td><td>${width}</td>`
      + `<td>${ready ? "ok" : "НЕ ОТРАБОТАЛ"}</td>`
      + `<td>${height} / ${demo.height}${fits ? "" : " ПЕРЕПОЛНЕНИЕ"}</td>`
      + `<td>${overflowX ? "ЕСТЬ" : "нет"}</td>`;
    report.append(row);
  }
}
window.__layout = { ok: results.every((r) => r.ok), results };
document.title = window.__layout.ok ? "OK: вёрстка" : "ОШИБКИ: вёрстка";
</script>
</body>
</html>
