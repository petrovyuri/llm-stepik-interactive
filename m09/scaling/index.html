<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Зачем делить на √d</title>
<link rel="stylesheet" href="../../kit/kit.css">
<style>
.controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
#d { flex: 1 1 260px; min-width: 200px; }
.controls label.flag { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; }
.bars { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.bars li { display: grid; grid-template-columns: 28px 64px 1fr 58px; gap: 10px; align-items: center; font-size: 13.5px; }
.bars .score { text-align: right; color: var(--muted); }
.track { height: 16px; background: var(--bg); border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
.fill { height: 100%; width: 0; background: var(--cyan); transition: width .15s; }
.pct { text-align: right; }
.stats { margin: 10px 0 0; display: grid; gap: 2px; font-size: 13.5px; }
.stats p { margin: 0; }
.note { margin: 4px 0 0; font-size: 12.5px; }
@media (max-width: 520px) { .bars li { grid-template-columns: 24px 54px 1fr 50px; gap: 6px; font-size: 12.5px; } }
</style>
</head>
<body>
<p class="eyebrow">Модуль 9 · урок «Код: внимание с обучаемыми весами»</p>
<h1>Зачем делить scores на √d</h1>
<noscript><div class="panel">Демо не запустилось. Откройте его в отдельной вкладке.</div></noscript>

<div class="panel">
  <div class="controls">
    <div id="d"></div>
    <label class="flag"><input type="checkbox" id="scale"> ÷√d</label>
    <button type="button" id="next">другой набор</button>
    <span class="muted" id="set"></span>
  </div>
</div>
<div class="panel">
  <ol class="bars mono" id="bars"></ol>
  <div class="stats mono"><p id="top"></p><p id="spread"></p><p id="params"></p></div>
</div>
<p class="caption" id="caption" aria-live="polite"></p>
<p class="muted note">Один запрос и 6 ключей со случайными числами (среднее 0, разброс 1). Векторы длиной d не показываем - только их scores.</p>

<script type="module">
import { DEFAULT_DIM, DIMS, SETS, captionText, paramsText, percentTexts, scoreTexts, spreadText, topText, weights } from "./logic.js";
import { el, ready, slider } from "../../kit/ui.js";

const $ = (id) => document.getElementById(id);
const KEYS = ["k1", "k2", "k3", "k4", "k5", "k6"];
const state = { di: DEFAULT_DIM, set: 0, scale: false };

const rows = KEYS.map((name) => {
  const score = el("span", { class: "score" });
  const fill = el("div", { class: "fill" });
  const pct = el("span", { class: "pct" });
  $("bars").append(el("li", {}, el("span", {}, name), score, el("div", { class: "track" }, fill), pct));
  return { score, fill, pct };
});

function render() {
  const { di, set, scale } = state;
  const w = weights(di, set, scale);
  const scores = scoreTexts(di, set);
  const pcts = percentTexts(di, set, scale);
  rows.forEach((r, k) => {
    r.score.textContent = scores[k];
    r.fill.style.width = `${(w[k] * 100).toFixed(1)}%`;
    r.pct.textContent = pcts[k];
  });
  $("set").textContent = `набор ${set + 1} из ${SETS}`;
  $("top").textContent = topText(di, set, scale);
  $("spread").textContent = spreadText(di, scale);
  $("params").textContent = paramsText(di);
  $("caption").textContent = captionText(di, set, scale);
}

slider($("d"), {
  label: "размер векторов",
  min: 0,
  max: DIMS.length - 1,
  step: 1,
  value: DEFAULT_DIM,
  format: (i) => `d = ${DIMS[i]}`,
  onInput(i) {
    state.di = i;
    render();
  },
});
$("scale").addEventListener("change", (e) => {
  state.scale = e.target.checked;
  render();
});
$("next").addEventListener("click", () => {
  state.set = (state.set + 1) % SETS;
  render();
});
render();
ready();
</script>
</body>
</html>
