<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Демо курса LLM</title>
<link rel="stylesheet" href="kit/kit.css">
<style>
.catalog { display: grid; gap: 10px; max-width: 720px; }
.catalog h2 { margin: 6px 0 0; font-size: 15px; color: var(--muted); font-weight: 600; }
.catalog ul { margin: 4px 0 0; padding-left: 20px; }
.catalog a { color: var(--cyan); }
</style>
</head>
<body>
<p class="eyebrow">Курс Stepik «LLM своими руками»</p>
<h1>Интерактивные демо</h1>
<div class="catalog" id="catalog"></div>
<script type="module">
import { el, ready } from "./kit/ui.js";

const demos = await (await fetch("./demos.json")).json();
const modules = [...new Set(demos.map((demo) => demo.module))];
document.getElementById("catalog").append(...modules.map((module) => el("section", {},
  el("h2", {}, `Модуль ${module}`),
  el("ul", {}, demos.filter((demo) => demo.module === module).map((demo) => el("li", {},
    el("a", { href: `${demo.slug}/` }, demo.title),
    el("span", { class: "muted" }, ` · урок ${demo.lesson}`)))))));
ready();
</script>
</body>
</html>
